<ion-tabs>

  <ion-tab-bar slot="bottom" class="tab-bar">
    <ion-tab-button tab="tab1">
      <ion-icon class="tab-text" name="log-in-outline"></ion-icon>
      <ion-label class="tab-text">Inicio de sesión</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2" [disabled]="isAuth==true">
      <ion-icon class="tab-text" name="qr-code-outline"></ion-icon>
      <ion-label class="tab-text">Escánear QR</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" [disabled]="isAuth==true">
      <ion-icon class="tab-text" name="log-out-outline"></ion-icon>
      <ion-label class="tab-text">Salir</ion-label>
    </ion-tab-button>
  </ion-tab-bar>

</ion-tabs>
